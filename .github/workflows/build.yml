name: Build Geode Mod

on:
workflow_dispatch:
push:

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - name: Build Windows Mod
    uses: geode-sdk/build-geode-mod@main
    id: build
    with:
      target: Win64

  - name: Upload Mod
    uses: actions/upload-artifact@v4
    with:
      name: Afterflow-Windows
      path: ${{ steps.build.outputs.build-output }}/*.geode
      if-no-files-found: error
```
